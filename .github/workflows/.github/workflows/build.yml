name: Build mod jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test core
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find core -name '*.java')
          java -Dstdout.encoding=UTF-8 -cp out pl.herobrinebrain.core.Sim
          java -Dstdout.encoding=UTF-8 -cp out pl.herobrinebrain.core.SnapshotTest
      - name: Build mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: herobrinebrain-jar
          path: build/libs/*.jar
