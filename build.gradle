plugins {
    id 'java-library'
    // UWAGA: wersja pluginu ModDevGradle - sprawdź najnowszą na https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'pl.herobrinebrain'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Rdzeń (czysta Java) żyje w osobnym katalogu i jest kompilowany razem z modem.
sourceSets.main.java.srcDir 'core/src/main/java'

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
